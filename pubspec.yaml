name: github_explorer
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  get: ^4.7.2
  get_storage: ^2.1.1
  intl: ^0.20.2
  dio: ^5.9.0
  url_launcher: ^6.3.2
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png

  flutter_lints: ^5.0.0

flutter:


  uses-material-design: true


  assets:
    - assets/
